name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: docker build -t dungeon-diorama:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name dd -e PORT=4100 -p 4100:4100 dungeon-diorama:ci
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://localhost:4100/healthz
          curl -fsS http://localhost:4100/ | grep -q "Dungeon Diorama"
          docker stop dd
          test "$(docker inspect -f '{{.State.ExitCode}}' dd)" = 0
