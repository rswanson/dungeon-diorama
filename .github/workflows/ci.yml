name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # This installs only what the cache does not hold, and the system packages.
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - run: docker build -t dungeon-diorama:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name dd -e PORT=4100 -p 4100:4100 dungeon-diorama:ci
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://localhost:4100/healthz
          curl -fsS http://localhost:4100/ | grep -q "Dungeon Diorama"
          docker stop dd
          test "$(docker inspect -f '{{.State.ExitCode}}' dd)" = 0
