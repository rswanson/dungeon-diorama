# The local Postgres for dev and for the tests. `npm run db:up` starts it and
# `npm run db:down` stops it. The data stays in the volume between runs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dd
      POSTGRES_PASSWORD: dd
      POSTGRES_DB: dd
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd -d dd"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
