<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110f" />
    <title>Dungeon Diorama</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <h1 class="title">Dungeon Diorama</h1>
    <canvas id="scene" aria-label="Game board"></canvas>
    <p class="notice" role="status"></p>
    <div class="hud" hidden>
      <button
        type="button"
        data-turn="left"
        aria-label="Turn left"
        aria-keyshortcuts="Q"
        title="Turn left (Q)"
      >
        ↺
      </button>
      <button
        type="button"
        data-turn="right"
        aria-label="Turn right"
        aria-keyshortcuts="E"
        title="Turn right (E)"
      >
        ↻
      </button>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
